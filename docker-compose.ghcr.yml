  services:
    mysql:
      image: mysql:8.0
      environment:
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
      volumes:
        - mysql_data:/var/lib/mysql
      # 如果不需要从宿主机连数据库，可以删掉下面这两行
      ports:
        - "3306:3306"

    redis:
      image: redis:7-alpine
      # 如果不需要从宿主机连 Redis，就不要开放端口
      # ports:
      #   - "6379:6379"

    api:
      image: ghcr.io/bglove2020/react-nest-admin-api:latest
      environment:
        NODE_ENV: production
        PORT: 3000
        mysql_host: mysql
        mysql_port: 3306
        mysql_username: root
        mysql_password: ${MYSQL_ROOT_PASSWORD}
        mysql_database: ${MYSQL_DATABASE}
        REDIS_HOST: redis
        REDIS_PORT: 6379
        JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
        JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      depends_on:
        - mysql
        - redis
      ports:
        - "3000:3000"

    web:
      image: ghcr.io/bglove2020/react-nest-admin-web:latest
      depends_on:
        - api
      ports:
        - "8080:80"

  volumes:
    mysql_data: