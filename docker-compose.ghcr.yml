services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    # 推荐：不对外暴露端口（容器内互通即可）
    # 如果你确实要在宿主机上用客户端直连（再配合 SSH 隧道更安全），用下面这行：
    # ports:
    #   - "127.0.0.1:3307:3306"

  redis:
    image: redis:7-alpine
    # 推荐：不开放端口（容器内部访问即可）
    # ports:
    #   - "127.0.0.1:6379:6379"

  api:
    image: ghcr.io/bglove2020/react-nest-admin-api:latest
    environment:
      NODE_ENV: production
      PORT: 3000

      mysql_host: mysql
      mysql_port: 3306
      mysql_username: root
      mysql_password: ${MYSQL_ROOT_PASSWORD}
      mysql_database: ${MYSQL_DATABASE}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      - mysql
      - redis
    ports:
      - "127.0.0.1:3200:3000"   # 避免占用宿主机 3000（你 Next.js 可能用着）

  web:
    image: ghcr.io/bglove2020/react-nest-admin-web:latest
    depends_on:
      - api
    ports:
      - "127.0.0.1:3100:80"     # 给宿主机 Nginx 反代用

volumes:
  mysql_data:
