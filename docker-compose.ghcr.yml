services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine

  api-seed:
    image: ghcr.io/bglove2020/react-nest-admin-api:latest
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      mysql_host: mysql
      mysql_port: 3306
      mysql_username: root
      mysql_password: ${MYSQL_ROOT_PASSWORD}
      mysql_database: ${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    command: ["node", "dist/seed.js"]
    restart: "no"

  api:
    image: ghcr.io/bglove2020/react-nest-admin-api:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      api-seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      mysql_host: mysql
      mysql_port: 3306
      mysql_username: root
      mysql_password: ${MYSQL_ROOT_PASSWORD}
      mysql_database: ${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    ports:
      - "127.0.0.1:3200:3000"

  web:
    image: ghcr.io/bglove2020/react-nest-admin-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3100:80"
