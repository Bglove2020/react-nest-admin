  services:
    mysql:
      image: mysql:8.0
      environment:
        MYSQL_ROOT_PASSWORD: ruoyi123
        MYSQL_DATABASE: simplified_ruoyi
      volumes:
        - mysql_data:/var/lib/mysql
      ports:
        - "3306:3306"

    redis:
      image: redis:7-alpine
      # ports:
      #   - "6379:6379"

    api:
      build:
        context: .
        dockerfile: apps/api/Dockerfile
      environment:
        NODE_ENV: production
        PORT: 3000
        mysql_host: mysql
        mysql_port: 3306
        mysql_username: root
        mysql_password: ${MYSQL_ROOT_PASSWORD}
        mysql_database: ${MYSQL_DATABASE}
        REDIS_HOST: redis
        REDIS_PORT: 6379
        JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
        JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      depends_on:
        - mysql
        - redis
      ports:
        - "3000:3000"

    web:
      build:
        context: .
        dockerfile: apps/web/Dockerfile
        args:
          VITE_API_BASE_URL: /api
      depends_on:
        - api
      ports:
        - "8080:80"

  volumes:
    mysql_data: